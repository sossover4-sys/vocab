<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f5fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0c16" media="(prefers-color-scheme: dark)" />
    <script>
      // קובע מצב בהיר/כהה לפני שהמסך מצויר, כדי שלא יהיה הבהוב
      try {
        var t = JSON.parse(localStorage.getItem('vocab-progress') || '{}').settings?.theme;
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <!-- הגדרות לאייפון: אייקון ומסך מלא כשפותחים ממסך הבית -->
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="אוצר מילים" />
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
    <title>אוצר מילים</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
